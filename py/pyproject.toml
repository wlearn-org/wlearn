[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wlearn"
version = "0.3.1"
description = "Portable ML computation primitives"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]
authors = [
  { name = "Anton Zemlyansky" },
]
keywords = ["machine-learning", "ml", "wasm", "xgboost", "random-forest", "portable"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
sklearn = ["scikit-learn>=1.3"]
liblinear = ["liblinear-official>=2.50"]
libsvm = ["libsvm-official>=3.30"]
nanoflann = ["pynanoflann>=0.10"]
ebm-fit = ["interpret>=0.6"]
tsetlin-fit = ["tmu>=0.8.3,<0.9"]
lightgbm = ["lightgbm>=4.0"]
stochtree = ["stochtree>=0.1"]
nn = ["polygrad>=0.7.0"]
dimred = ["wlearn-dimred>=0.1.0,<0.2"]
bo = ["wlearn-bo>=0.1.0"]
rf = ["wlearn-rf>=0.4.1"]
gam = ["wlearn-gam>=0.2.0"]
cluster = ["wlearn-cluster>=0.1.0"]
basis = ["wlearn-basis>=0.1.0"]
sym = ["wlearn-sym[polygrad]>=0.1.0"]
uncertainty = ["wlearn-uncertainty>=0.1.0"]
preprocess = ["tranfi>=0.2.1,<0.3"]
all = [
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "liblinear-official>=2.50",
    "libsvm-official>=3.30",
    "pynanoflann>=0.10",
    "interpret>=0.6",
    "tmu>=0.8.3,<0.9",
    "lightgbm>=4.0",
    "stochtree>=0.1",
    "polygrad>=0.7.0",
    "wlearn-bo>=0.1.0",
    "wlearn-rf>=0.4.1",
    "wlearn-gam>=0.2.0",
    "wlearn-cluster>=0.1.0",
    "wlearn-basis>=0.1.0",
    "wlearn-sym[polygrad]>=0.1.0",
    "wlearn-uncertainty>=0.1.0",
    "tranfi>=0.2.1,<0.3",
]
test = ["pytest>=7.0", "hypothesis>=6.0"]
solver = ["z3-solver>=4.12,<4.15.4"]

[tool.setuptools.packages.find]
include = ["wlearn*"]

[tool.setuptools.package-data]
"wlearn.automl" = ["portfolio.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/wlearn-org/wlearn"
Repository = "https://github.com/wlearn-org/wlearn"
